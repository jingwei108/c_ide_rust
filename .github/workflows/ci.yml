name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 夜间全量重算（北京时间 02:00）：Clang Golden 缓存强制失效重算，防版本漂移
    # （见 shadow_verify.py 文件头「提速设施」与 docs/current 工作记录）
    - cron: '0 18 * * *'

# 前端切割（2026-09-11）：CideFlutter / FRB / flutter-android-ios jobs 已随前端
# 迁出（标签 before-frontend-split 保留完整历史）。本仓库现为纯后端仓，
# CI 只验证 Rust 引擎 + 三出口防线。wasm 出口冒烟见主计划 Phase 2a。
jobs:
  rust:
    name: Rust Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native (Debug)
        run: cargo build
        working-directory: native

      - name: Build native (Release)
        run: cargo build --release
        working-directory: native

      - name: Check Bytecode Libc precompiled artifacts are up-to-date
        run: python scripts/precompile_bytecode_libc.py --check
        shell: bash

      - name: Run Rust tests
        run: cargo test --workspace --all-features
        working-directory: native

      # cargo test 已覆盖全部单元/集成测试（含 Phase A/B/C/E/Dogfooding），
      # 无需再单独运行各防线测试套件。
      - name: Three Tier Consistency Check & Report
        run: python scripts/ci_three_tier_check.py
        shell: bash

      - name: Upload Three Tier Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-tier-report
          path: reports/three_tier_report.md

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: native

      # Clang Golden 缓存（方案 A）：结果是确定性的（同一源码 + 同一 clang 版本
      # ⇒ 同一结果），跨 CI 运行复用可把 Shadow 从分钟级降到秒级。
      # key 含 clang 版本 —— 版本一变缓存自动失效，这就是"防版本漂移"的第一道闸；
      # 第二道闸是夜间 schedule 的 --refresh-clang 全量重算。
      - name: Clang version (for cache key)
        id: clangver
        shell: bash
        run: echo "value=$(clang --version | head -n1 | tr -d ' ' | cut -c1-48)" >> "$GITHUB_OUTPUT"

      - name: Cache Clang golden results
        uses: actions/cache@v4
        with:
          path: native/tests/shadow_verification/.clang_cache
          key: clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('native/tests/shadow_verification/shadow_verify.py') }}
          restore-keys: |
            clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-

      - name: Shadow Verification
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 夜间全量重算：忽略缓存、重算并覆盖写回，防止 Golden 随 clang 漂移
            EXTRA="--refresh-clang"
            echo "夜间模式：Clang Golden 全量重算（$EXTRA）"
          fi
          python native/tests/shadow_verification/shadow_verify.py $EXTRA --report native/tests/shadow_verification/reports/shadow_report.md --json native/tests/shadow_verification/reports/shadow_data.json

      - name: Upload Shadow Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-verification-report
          path: |
            native/tests/shadow_verification/reports/shadow_report.md
            native/tests/shadow_verification/reports/kr_leetcode_report.json

      - name: C++ Shadow Verification
        run: python scripts/shadow_verify_cpp.py
        shell: bash

      - name: Upload C++ Shadow Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-shadow-verification-report
          path: native/tests/shadow_verification/reports/cpp_shadow_report.json

      # 出口 3 防线：serve JSON-lines 协议契约（id 关联 / 错误帧同构 / session.reset
      # / 与 capi 共用的入口语义）。依赖上一步 Debug 构建的 cide_cli。
      - name: cide_cli serve smoke (Exit 3 protocol contract)
        run: python scripts/serve_smoke.py
        shell: bash

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.16
        # 固定版本，避免非确定性；rust-cache 已缓存 cargo 目录

      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info
        working-directory: native

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: native/lcov.info
